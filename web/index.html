<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Play Star Battle: logic puzzles with provably unique solutions and hints that teach the technique instead of giving the answer.">
  <meta name="theme-color" content="#141821">

  <!--
    This page is the APP. It renders into a canvas, so a crawler reads nothing
    from it — which is exactly why the indexable content lives in hand-written
    static pages at / and /star-battle/ rather than here. The canonical link
    points a crawler that lands here back at the page it should actually read.
  -->
  <link rel="canonical" href="https://vitora-q.github.io/nodro/star-battle/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Nodro — Star Battle">
  <meta property="og:description" content="Logic puzzles with provably unique solutions and hints that teach.">
  <meta property="og:image" content="https://vitora-q.github.io/nodro/og.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nodro">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!--
    Three favicons on purpose. The SVG is what a modern browser picks and it
    scales to any tab size; the ICO carries hand-sized 16, 32 and 48 bitmaps
    for clients that ask for /favicon.ico without reading this file at all; the
    PNG is the plain fallback. The 16px bitmap is drawn at 16px rather than
    downscaled — at 256 total pixels a downscale turns the star to mush.
  -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="alternate icon" href="favicon.ico">

  <title>Nodro — Star Battle</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#FAF7F1;margin:0">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Cookie-free analytics hook.

    The app calls window.nodroTrack(event, ["key","value","key","value"]). With
    no provider configured this is a no-op, which is the correct default:
    shipping without analytics must never break the game.

    To switch it on, add ONE cookieless provider script above this block and
    forward the event inside the function — Cloudflare Web Analytics,
    GoatCounter and Umami all take a name plus a flat object. Nothing here
    stores an identifier, and no event carries anything that could become one.
  -->
  <script>
    window.nodroTrack = function (event, pairs) {
      var props = {};
      for (var i = 0; i + 1 < pairs.length; i += 2) { props[pairs[i]] = pairs[i + 1]; }
      // Example, once a provider is added:
      // if (window.umami) { window.umami.track(event, props); }
      if (window.__nodroDebugAnalytics) { console.log('[nodro]', event, props); }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
